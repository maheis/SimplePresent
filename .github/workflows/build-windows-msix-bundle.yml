name: CI - Build Windows MSIX Bundle

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  msix:
    name: Build MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Ensure CMake is up-to-date
        run: |
          choco install cmake --installargs '"ADD_CMAKE_TO_PATH=System"' -y
          cmake --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Read app version and update MSIX version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+\d+)?\s*$') {
            throw "Could not read a valid semantic version from pubspec.yaml"
          }
          $msixVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          $pubspec = $pubspec -replace '(?m)^\s*msix_version:\s*.*$', "  msix_version: $msixVersion"
                    if ($pubspec -notmatch '(?m)^\s*msix_version:') {
            $pubspec = $pubspec -replace '(?m)^(\s*publisher:.*)$', "`$1`r`n  msix_version: $msixVersion"
          }
          Set-Content -Path pubspec.yaml -Value $pubspec -NoNewline
          "MSIX version: $msixVersion"
          "version=$msixVersion" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build windows --release

      - name: Detect MSIX signing certificate
        id: signing
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets['MSIX_CERTIFICATE_BASE64'] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_CERTIFICATE_BASE64)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Restore MSIX signing certificate
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets['MSIX_CERTIFICATE_BASE64'] }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "simplepresent-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = $pubspec -replace '(?m)^\s*certificate_path:\s*.*$', "  certificate_path: $certificatePath"
          if ($pubspec -notmatch '(?m)^\s*certificate_path:') {
            $pubspec = $pubspec -replace '(?m)^(\s*publisher:.*)$', "`$1`r`n  certificate_path: $certificatePath"
          }
          Set-Content -Path pubspec.yaml -Value $pubspec -NoNewline

      - name: Create MSIX package
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets['MSIX_CERTIFICATE_PASSWORD'] }}
        run: dart run msix:create --store --certificate-password "$env:MSIX_CERTIFICATE_PASSWORD"

      - name: Create unsigned MSIX package for Microsoft Store
        if: ${{ steps.signing.outputs.enabled != 'true' }}
        run: dart run msix:create --store

      - name: Package MSIX artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_dist | Out-Null
          $msix = Get-ChildItem -Path build/windows -Filter *.msix -Recurse -File | Select-Object -First 1
          if (-not $msix) {
            throw "MSIX output not found below build/windows"
          }
          Copy-Item $msix.FullName "release_dist/simplepresent-$env:MSIX_VERSION.msix"
        env:
          MSIX_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplepresent-msix-${{ steps.version.outputs.version }}
          path: release_dist/*.msix

      - name: Upload MSIX artifact to Release
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: release_dist/simplepresent-${{ steps.version.outputs.version }}.msix
          asset_name: simplepresent-${{ steps.version.outputs.version }}.msix
          asset_content_type: application/msix
