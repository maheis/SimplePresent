name: CI - Build Android App Bundle

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-aab:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: set up java
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          java-package: "jdk"

      - name: set up flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: accept android licenses
        run: |
          yes | flutter doctor --android-licenses || true

      - name: verify java toolchain
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version
          which javac
          javac -version

      - name: flutter pub get
        run: flutter pub get

      - name: read app version from pubspec
        id: pubspec-version
        run: |
          version=$(awk '/^version:/ { print $2 }' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: restore keystore (from secret KEYSTORE_BASE64)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > ./android/app/keystore.jks

      - name: write android/key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: verify release keystore is present
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty. The build would be debug-signed. Aborting to avoid uploading a debug-signed build." >&2
            exit 1
          fi

      - name: build app bundle
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: flutter build appbundle --release

      - name: package release aab
        run: |
          mkdir -p release_dist
          cp build/app/outputs/bundle/release/app-release.aab \
            "release_dist/simplepresent-aab-${{ steps.pubspec-version.outputs.version }}.aab"

      - name: upload aab artifact
        uses: actions/upload-artifact@v5
        with:
          name: simplepresent-aab-${{ steps.pubspec-version.outputs.version }}
          path: release_dist/simplepresent-aab-${{ steps.pubspec-version.outputs.version }}.aab
